<div class="flex h-screen w-full overflow-hidden bg-ground">
  @if (mobileOpen()) {
    <div
      class="fixed inset-0 z-30 bg-black/40 backdrop-blur-sm lg:hidden"
      (click)="cerrarMobile()"
      aria-hidden="true"
    ></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 shrink-0 overflow-y-auto flex-col bg-surface-900 text-surface-0 transition-all duration-300 lg:static lg:translate-x-0"
    [class.-translate-x-full]="!mobileOpen()"
    [class.lg:w-20]="collapsed()"
  >
    <div
      class="flex h-16 items-center gap-3 px-5"
      [class.justify-center]="!mostrarTexto()"
      [class.px-0]="!mostrarTexto()"
    >
      <div
        class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-primary text-primary-contrast shadow-lg"
      >
        <img src="/icon.png" alt="Mantia Servicios" class="w-10/12" />
      </div>
      @if (mostrarTexto()) {
        <div class="fade-in-up overflow-hidden">
          <p class="text-base font-extrabold leading-none tracking-tight">Mantia</p>
          <p class="text-[11px] font-medium text-surface-400">Servicios S.A.S.</p>
        </div>
      }
    </div>

    <nav class="mt-4 flex flex-1 flex-col gap-1 px-3">
      @for (item of nav; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary text-white text-primary-contrast shadow-md"
          [routerLinkActiveOptions]="{ exact: item.route === '/panel' }"
          [pTooltip]="!mostrarTexto() ? item.label : ''"
          tooltipPosition="right"
          (click)="cerrarMobile()"
          class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-surface-300 transition-colors hover:bg-surface-800 hover:text-surface-0"
          [class.justify-center]="!mostrarTexto()"
        >
          <i class="pi" [ngClass]="item.icon" style="font-size: 1rem"></i>
          @if (mostrarTexto()) {
            <span>{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    @if (mostrarTexto()) {
      <div class="m-3 rounded-2xl bg-surface-800 p-4 text-xs text-surface-300">
        <p class="font-semibold text-surface-0">Prototipo</p>
        <p class="mt-1 leading-relaxed text-surface-400">
          Las cotizaciones se generan en borrador para revisión de Laura.
        </p>
      </div>
    }

    <div class="m-3 flex flex-col gap-2">
      <button
        type="button"
        (click)="temas.alternar()"
        [pTooltip]="mostrarTexto() ? '' : (temas.oscuro() ? 'Modo claro' : 'Modo oscuro')"
        tooltipPosition="right"
        [attr.aria-label]="temas.oscuro() ? 'Activar tema claro' : 'Activar tema oscuro'"
        class="cursor-pointer flex items-center justify-center gap-2 rounded-xl bg-surface-800 py-2.5 text-surface-300 transition-colors hover:bg-surface-700 hover:text-surface-0"
      >
        <i class="pi theme-icon" [ngClass]="temas.oscuro() ? 'pi-sun' : 'pi-moon'"></i>
        @if (mostrarTexto()) {
          <span class="text-sm font-medium">{{ temas.oscuro() ? 'Modo claro' : 'Modo oscuro' }}</span>
        }
      </button>

      <button
        type="button"
        (click)="toggle()"
        aria-label="Colapsar menú"
        class="cursor-pointer hidden items-center justify-center gap-2 rounded-xl bg-surface-800 py-2.5 text-surface-300 transition-colors hover:bg-surface-700 hover:text-surface-0 lg:flex"
      >
        <i class="pi" [ngClass]="collapsed() ? 'pi-angle-double-right' : 'pi-angle-double-left'"></i>
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-20 flex h-16 shrink-0 items-center gap-3 border-b border-line bg-panel/90 px-4 backdrop-blur lg:hidden"
    >
      <button
        type="button"
        (click)="toggleMobile()"
        class="cursor-pointer grid h-10 w-10 place-items-center rounded-xl text-body-soft transition-colors hover:bg-panel-hover"
        aria-label="Abrir menú"
      >
        <i class="pi pi-bars text-lg"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="grid h-8 w-8 place-items-center rounded-lg bg-primary text-primary-contrast">
          <!-- <i class="pi pi-wrench text-sm"></i> -->
          <img src="/icon.png" alt="Mantia Servicios" class="w-10/12" />
        </div>
        <span class="text-base font-extrabold tracking-tight text-body">Mantia</span>
      </div>
      <button
        type="button"
        (click)="temas.alternar()"
        [attr.aria-label]="temas.oscuro() ? 'Activar tema claro' : 'Activar tema oscuro'"
        class="cursor-pointer ml-auto grid h-10 w-10 place-items-center rounded-xl text-body-soft transition-colors hover:bg-panel-hover"
      >
        <i class="pi theme-icon" [ngClass]="temas.oscuro() ? 'pi-sun' : 'pi-moon'"></i>
      </button>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>

    <app-footer />
  </div>
</div>
