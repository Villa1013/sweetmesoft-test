<app-page>
  <app-page-header
    title="Tarifas de servicios"
    subtitle="Precios antes de IVA. Una misma visita a una sede tiene un solo cobro de desplazamiento."
  />

  <div class="fade-in-up mt-5 flex flex-wrap gap-2">
    <button
      type="button"
      (click)="seleccionarVersion(null)"
      class="rounded-xl border px-4 py-2 text-sm font-semibold transition-colors"
      [class]="
        versionActiva() === null
          ? 'border-primary bg-primary text-primary-contrast'
          : 'border-surface-200 bg-white text-surface-600 hover:border-primary hover:text-primary'
      "
    >
      Todas
    </button>
    @for (v of versiones(); track v) {
      <button
        type="button"
        (click)="seleccionarVersion(v)"
        class="rounded-xl border px-4 py-2 text-sm font-semibold transition-colors"
        [class]="
          versionActiva() === v
            ? 'border-primary bg-primary text-primary-contrast'
            : 'border-surface-200 bg-white text-surface-600 hover:border-primary hover:text-primary'
        "
      >
        Versión {{ v }}
      </button>
    }
  </div>

  <app-card class="fade-in-up mt-4 block">
    <p-table
      [value]="filtradas()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="12"
      styleClass="p-datatable-sm"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 8rem">Código</th>
          <th>Concepto</th>
          <th style="width: 10rem">Unidad</th>
          <th style="width: 10rem">Tipo</th>
          <th style="width: 8rem" class="text-right">Precio</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-t>
        <tr class="text-sm">
          <td class="font-mono text-sm font-semibold text-primary">{{ t.codigo }}</td>
          <td class="text-surface-700">{{ t.concepto }}</td>
          <td class="text-surface-500">{{ t.unidad }}</td>
          <td>
            <p-tag
              [value]="tipoTarifaLabel(t.tipo)"
              [severity]="t.tipo === 'Desplazamiento' ? 'info' : 'secondary'"
            />
          </td>
          <td class="text-right font-bold text-surface-900">{{ t.precioUnitarioCOP | cop }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="py-10 text-center text-sm text-surface-500">
            No hay tarifas para esta versión.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </app-card>
</app-page>

<p-toast position="bottom-right" />
